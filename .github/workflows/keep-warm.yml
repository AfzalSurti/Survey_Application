name: Keep API warm

# Render's free plan puts the API to sleep after ~15 min of no traffic, and the
# next request then pays a 30-60s cold start. For field surveyors that shows up
# as "Submit survey does nothing for a minute" and very slow first syncs.
# This pings the health endpoint on a schedule so the instance stays awake
# through Indian field hours (07:30-23:40 IST ≈ 02:00-18:10 UTC).

on:
  schedule:
    - cron: "*/10 2-18 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 \
              https://survey-application-4r6q.onrender.com/api/health || true)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "health check never returned 200"
          exit 1
